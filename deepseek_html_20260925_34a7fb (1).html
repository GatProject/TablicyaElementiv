<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Періодична таблиця елементів | Хімія</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e1a;
            --panel-bg: rgba(20, 27, 45, 0.85);
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08) 0%, transparent 25%);
            color: var(--text-color);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ===== ВЕРХНЯ ПАНЕЛЬ ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            flex-shrink: 0;
            animation: fadeInDown 0.5s ease-out;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
        }

        .brand h1 {
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .brand p {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .search-wrapper {
            flex: 1;
            max-width: 420px;
            position: relative;
            min-width: 200px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 8px 14px 8px 36px;
            border-radius: 9px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 0.82rem;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .search-wrapper input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .search-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.6;
            pointer-events: none;
        }

        .stats {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }

        .stat-item { text-align: center; }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* ===== ЛЕГЕНДА ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 6px 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            flex-shrink: 0;
            animation: fadeInDown 0.6s ease-out;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .legend-item:hover {
            background: rgba(0, 0, 0, 0.45);
            color: var(--text-color);
        }

        .legend-item.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--text-color);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--dot-color);
        }

        /* ===== ОСНОВНИЙ КОНТЕЙНЕР ===== */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 10px;
            min-height: 0;
            animation: fadeInUp 0.7s ease-out;
        }

        /* ===== ТАБЛИЦЯ ===== */
        .table-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
        }

        .table-container {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 3px;
            width: 100%;
            height: 100%;
            aspect-ratio: 18 / 11;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
        }

        .element {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 2px 3px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            min-width: 0;
            min-height: 0;
        }

        .element::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--cat-color, #94a3b8);
            transition: height 0.2s;
        }

        .element:hover {
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 8px 20px -4px rgba(0,0,0,0.6), 0 0 15px -3px var(--cat-color, #38bdf8);
            border-color: var(--cat-color, #38bdf8);
        }

        .element:hover::before { height: 4px; }

        .element.selected {
            border-color: var(--cat-color, #38bdf8);
            box-shadow: 0 0 0 2px var(--cat-color, #38bdf8), 0 6px 16px -3px var(--cat-color, #38bdf8);
            transform: scale(1.05);
            z-index: 5;
        }

        .element.dimmed {
            opacity: 0.12;
            filter: grayscale(0.9);
            pointer-events: none;
        }

        .el-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: clamp(0.4rem, 0.55vw, 0.6rem);
            line-height: 1;
            color: var(--text-muted);
            gap: 1px;
        }

        .el-number {
            font-weight: 600;
            color: #cbd5e1;
        }

        .el-mass {
            font-size: clamp(0.35rem, 0.5vw, 0.55rem);
            color: var(--text-muted);
            text-align: right;
            opacity: 0.85;
        }

        .el-symbol {
            font-size: clamp(0.65rem, 1.1vw, 1.3rem);
            font-weight: 800;
            text-align: center;
            color: #fff;
            line-height: 1;
            margin: 1px 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px var(--cat-color, transparent);
        }

        .el-name {
            font-size: clamp(0.35rem, 0.5vw, 0.58rem);
            text-align: center;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
            line-height: 1;
        }

        .el-bottom {
            display: flex;
            justify-content: center;
            font-size: clamp(0.3rem, 0.45vw, 0.5rem);
            color: var(--text-muted);
        }

        .el-bottom span {
            padding: 0 3px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            font-weight: 500;
            line-height: 1.4;
        }

        .empty { visibility: hidden; }

        /* ===== БІЧНА ПАНЕЛЬ ===== */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .sidebar-title {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .sidebar-title::before {
            content: '';
            width: 3px;
            height: 12px;
            background: linear-gradient(to bottom, #38bdf8, #c084fc);
            border-radius: 2px;
        }

        .sidebar-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
            flex: 1;
            padding: 20px 10px;
        }

        .sidebar-placeholder-icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .sidebar-placeholder p {
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .element-detail { display: none; flex: 1; overflow-y: auto; }
        .element-detail.active { display: block; animation: fadeInUp 0.35s ease-out; }

        .element-detail::-webkit-scrollbar { width: 4px; }
        .element-detail::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.4); border-radius: 10px; }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-symbol-box {
            width: 62px;
            height: 62px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--cat-color, #38bdf8);
            border-radius: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px -5px var(--cat-color, #38bdf8), inset 0 0 16px -8px var(--cat-color, #38bdf8);
            flex-shrink: 0;
        }

        .detail-symbol-box .big-symbol {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1;
            color: #fff;
        }

        .detail-symbol-box .small-number {
            font-size: 0.55rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .detail-titles h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.1;
        }

        .detail-titles .cat-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
            background: var(--cat-color, #38bdf8);
            color: #0a0e1a;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .detail-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            transition: all 0.2s;
        }

        .detail-card:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .detail-card.full { grid-column: 1 / -1; }

        .detail-card label {
            display: block;
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 3px;
            font-weight: 500;
        }

        .detail-card .val {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .detail-card .val.mono {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 600;
            word-break: break-word;
        }

        .detail-card .unit {
            font-size: 0.62rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 2px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1100px) {
            .main-container { grid-template-columns: 1fr 240px; }
            .el-name { display: none; }
        }

        @media (max-width: 900px) {
            html, body { overflow: auto; height: auto; }
            .main-container { 
                grid-template-columns: 1fr; 
                grid-template-rows: auto auto;
            }
            .table-wrapper { aspect-ratio: auto; }
            .table-container { aspect-ratio: 18 / 11; }
            .sidebar { min-height: 300px; }
            .el-name { display: none; }
        }

        @media (max-width: 600px) {
            body { padding: 6px; gap: 6px; }
            .top-bar { padding: 6px 10px; }
            .brand h1 { font-size: 0.8rem; }
            .brand p { display: none; }
            .el-mass, .el-bottom { display: none; }
            .el-symbol { font-size: clamp(0.5rem, 2vw, 0.9rem); }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-icon">⚛️</div>
            <div>
                <h1>Періодична таблиця</h1>
                <p>Інтерактивний довідник хімічних елементів</p>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="search" placeholder="Пошук за назвою, символом або номером...">
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="statTotal">118</div>
                <div class="stat-label">Елементів</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statShown">118</div>
                <div class="stat-label">Показано</div>
            </div>
        </div>
    </div>

    <!-- ЛЕГЕНДА -->
    <div class="legend" id="legend"></div>

    <!-- ОСНОВНИЙ КОНТЕЙНЕР -->
    <div class="main-container">
        <div class="table-wrapper">
            <div class="table-container" id="periodicTable"></div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-title">Деталі елемента</div>
            
            <div class="sidebar-placeholder" id="placeholder">
                <div class="sidebar-placeholder-icon">🧪</div>
                <p>Натисніть на елемент,<br>щоб побачити деталі</p>
            </div>

            <div class="element-detail" id="elementDetail">
                <div class="detail-header">
                    <div class="detail-symbol-box" id="detailSymbolBox">
                        <span class="big-symbol" id="detailSymbol">H</span>
                        <span class="small-number" id="detailSmallNumber">1</span>
                    </div>
                    <div class="detail-titles">
                        <h2 id="detailName">Гідроген</h2>
                        <span class="cat-badge" id="detailCategory">Неметал</span>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-card">
                        <label>Атомна маса</label>
                        <div class="val" id="detailMass">1.008 <span class="unit">а.о.м.</span></div>
                    </div>
                    <div class="detail-card">
                        <label>Порядковий номер</label>
                        <div class="val" id="detailNumber">1</div>
                    </div>
                    <div class="detail-card">
                        <label>Період</label>
                        <div class="val" id="detailPeriod">1</div>
                    </div>
                    <div class="detail-card">
                        <label>Група</label>
                        <div class="val" id="detailGroup">1</div>
                    </div>
                    <div class="detail-card full">
                        <label>Електронна конфігурація</label>
                        <div class="val mono" id="detailConfig">1s¹</div>
                    </div>
                    <div class="detail-card full">
                        <label>Категорія</label>
                        <div class="val" id="detailCatFull" style="font-size:0.82rem;">Неметал</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

        const categories = {
            "alkali": "Лужний метал",
            "alkaline": "Лужноземельний",
            "transition": "Перехідний метал",
            "post-transition": "Постперехідний",
            "metalloid": "Металоїд",
            "nonmetal": "Неметал",
            "halogen": "Галоген",
            "noble": "Благородний газ",
            "lanthanide": "Лантаноїд",
            "actinide": "Актиноїд",
            "unknown": "Невідомі"
        };

        const categoryColors = {
            "alkali": "#f87171",
            "alkaline": "#fbbf24",
            "transition": "#60a5fa",
            "post-transition": "#34d399",
            "metalloid": "#a78bfa",
            "nonmetal": "#f472b6",
            "halogen": "#22d3ee",
            "noble": "#c084fc",
            "lanthanide": "#fb923c",
            "actinide": "#e879f9",
            "unknown": "#94a3b8"
        };

        // ===== ЛЕГЕНДА =====
        const legend = document.getElementById('legend');
        Object.entries(categories).forEach(([key, label]) => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.dataset.cat = key;
            item.innerHTML = `<span class="legend-dot" style="--dot-color:${categoryColors[key]}"></span>${label}`;
            item.addEventListener('click', () => toggleCategoryFilter(key, item));
            legend.appendChild(item);
        });

        let activeFilter = null;

        function toggleCategoryFilter(cat, item) {
            if (activeFilter === cat) {
                activeFilter = null;
                item.classList.remove('active');
            } else {
                activeFilter = cat;
                document.querySelectorAll('.legend-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            }
            applyFilters();
        }

        // ===== ПОБУДОВА ТАБЛИЦІ =====
        const table = document.getElementById('periodicTable');

        function createElementCard(el) {
            const div = document.createElement('div');
            div.className = 'element';
            div.style.setProperty('--cat-color', categoryColors[el.category]);
            div.dataset.name = el.name.toLowerCase();
            div.dataset.symbol = el.symbol.toLowerCase();
            div.dataset.number = el.number;
            div.dataset.category = el.category;

            div.innerHTML = `
                <div class="el-top">
                    <span class="el-number">${el.number}</span>
                    <span class="el-mass">${el.mass}</span>
                </div>
                <div class="el-symbol">${el.symbol}</div>
                <div class="el-name">${el.name}</div>
                <div class="el-bottom"><span>гр.${el.group}</span></div>
            `;

            div.addEventListener('click', () => selectElement(el, div));
            return div;
        }

        // Сітка 7x18
        const grid = Array(7).fill().map(() => Array(18).fill(null));
        elements.forEach(el => {
            if (el.number >= 57 && el.number <= 71) return;
            if (el.number >= 89 && el.number <= 103) return;
            const row = el.period - 1;
            const col = el.group - 1;
            if (row >= 0 && row < 7 && col >= 0 && col < 18) grid[row][col] = el;
        });

        // Заповнюємо: 7 рядків основних + 1 порожній + 1 лантаноїди + 1 актиноїди = 10 рядків
        for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 18; c++) {
                const el = grid[r][c];
                if (el) {
                    table.appendChild(createElementCard(el));
                } else {
                    const div = document.createElement('div');
                    div.className = 'empty';
                    table.appendChild(div);
                }
            }
        }
        // Порожній роздільник
        for (let c = 0; c < 18; c++) {
            const div = document.createElement('div');
            div.className = 'empty';
            table.appendChild(div);
        }
        // Лантаноїди (з зсувом 2)
        for (let i = 0; i < 2; i++) {
            const div = document.createElement('div');
            div.className = 'empty';
            table.appendChild(div);
        }
        elements.filter(el => el.number >= 57 && el.number <= 71).forEach(el => {
            table.appendChild(createElementCard(el));
        });
        table.appendChild(Object.assign(document.createElement('div'), { className: 'empty' }));
        // Актиноїди (з зсувом 2)
        for (let i = 0; i < 2; i++) {
            const div = document.createElement('div');
            div.className = 'empty';
            table.appendChild(div);
        }
        elements.filter(el => el.number >= 89 && el.number <= 103).forEach(el => {
            table.appendChild(createElementCard(el));
        });
        table.appendChild(Object.assign(document.createElement('div'), { className: 'empty' }));

        // ===== ВИБІР ЕЛЕМЕНТА =====
        function selectElement(el, card) {
            document.querySelectorAll('.element').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');

            const placeholder = document.getElementById('placeholder');
            const detail = document.getElementById('elementDetail');
            placeholder.style.display = 'none';
            detail.classList.add('active');

            const color = categoryColors[el.category];

            document.getElementById('detailSymbolBox').style.setProperty('--cat-color', color);
            document.getElementById('detailSymbol').textContent = el.symbol;
            document.getElementById('detailSmallNumber').textContent = el.number;
            document.getElementById('detailName').textContent = el.name;
            document.getElementById('detailCategory').textContent = categories[el.category];
            document.getElementById('detailCategory').style.setProperty('--cat-color', color);
            document.getElementById('detailMass').innerHTML = `${el.mass} <span class="unit">а.о.м.</span>`;
            document.getElementById('detailNumber').textContent = el.number;
            document.getElementById('detailPeriod').textContent = el.period;
            document.getElementById('detailGroup').textContent = el.group;
            document.getElementById('detailConfig').textContent = el.config;
            document.getElementById('detailCatFull').textContent = categories[el.category];
            document.getElementById('detailCatFull').style.color = color;
        }

        // ===== ПОШУК ТА ФІЛЬТРИ =====
        const searchInput = document.getElementById('search');
        const statShown = document.getElementById('statShown');

        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            let shown = 0;

            document.querySelectorAll('.element').forEach(div => {
                const name = div.dataset.name;
                const symbol = div.dataset.symbol;
                const number = div.dataset.number;
                const cat = div.dataset.category;

                const matchesSearch = !query || name.includes(query) || symbol.includes(query) || number.includes(query);
                const matchesCategory = !activeFilter || cat === activeFilter;

                if (matchesSearch && matchesCategory) {
                    div.classList.remove('dimmed');
                    shown++;
                } else {
                    div.classList.add('dimmed');
                }
            });

            statShown.textContent = shown;
        }

        searchInput.addEventListener('input', applyFilters);
    </script>
